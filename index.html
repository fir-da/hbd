<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday! 🎉</title>
  
  <!-- Font Playful (Fredoka & Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Custom Colors -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'title': ['Fredoka', 'sans-serif'],
            'body': ['Quicksand', 'sans-serif'],
          },
          colors: {
            'jingga-1': '#F9E6A8', 
            'jingga-2': '#F2A900', 
            'jingga-3': '#CC6F00', 
            'jingga-4': '#4D2A00', 
          }
        }
      }
    }
  </script>

  <!-- Script Ringan untuk Efek Confetti 🎉 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Efek melayang pelan untuk cover kartu */
    .float-anim {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-jingga-1 via-jingga-2 to-jingga-3 min-h-screen flex items-center justify-center p-4 sm:p-5 overflow-hidden">

  <!-- === INI YANG DITAMBAHKAN: Tag Audio === -->
  <audio id="laguUltah" src="Happy Birthday to You (Guitar).mp3" preload="auto"></audio>

  <!-- ==========================================
       KARTU UTAMA (Dioptimalkan untuk HP)
  =========================================== -->
  <div class="relative w-[90%] max-w-[400px] h-[75vh] min-h-[480px] max-h-[600px] bg-white rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- 1. BAGIAN DALAM KARTU (Pesan) -->
    <div id="pesanDalam" class="absolute inset-0 p-6 sm:p-8 flex flex-col items-center justify-center text-center opacity-0 scale-95 transition-all duration-700 ease-out z-0">
      <div class="w-16 h-16 sm:w-20 sm:h-20 mb-3 sm:mb-4 text-5xl">🎂</div>
      <h2 class="font-title text-2xl sm:text-3xl text-jingga-3 mb-3 sm:mb-4 leading-tight">Happy Birthday,<br>Farekha!</h2>
      
      <p class="font-body text-jingga-4 text-[13.5px] sm:text-[15px] leading-relaxed mb-5 sm:mb-6 font-medium px-2">
        Selamat bertambah usia! Semoga hari-harimu selalu dipenuhi kebahagiaan, rezeki yang lancar, dan semua impian baikmu segera terwujud. 
        <br><br>
        Terima kasih sudah menjadi orang yang luar biasa! ✨
      </p>

      <p class="font-title text-sm text-jingga-2 font-bold">Dari: AF'</p>
    </div>

    <!-- 2. COVER KARTU (Sampul Depan) -->
    <div id="coverKartu" class="absolute inset-0 bg-white p-5 sm:p-7 flex flex-col items-center justify-center text-center z-10 transition-transform duration-700 ease-in-out origin-top border-[5px] border-white">
      <div class="bg-jingga-1 w-full h-full rounded-2xl flex flex-col items-center justify-center p-5 sm:p-6 shadow-inner relative overflow-hidden border border-jingga-2/30">
        
        <div class="absolute -top-4 -right-4 w-16 h-16 bg-white/50 rounded-full blur-xl"></div>
        <div class="absolute -bottom-4 -left-4 w-20 h-20 bg-white/50 rounded-full blur-xl"></div>

        <div class="text-5xl sm:text-6xl mb-4 float-anim">💌</div>
        <h1 class="font-title text-xl sm:text-2xl text-jingga-4 mb-2 px-2">Ada Pesan Rahasia!</h1>
        <p class="font-body text-[13px] sm:text-sm text-jingga-3 font-bold mb-8">Khusus buat kamu hari ini.</p>
        
        <button onclick="bukaKartu()" class="px-5 py-3 sm:px-6 sm:py-3.5 bg-jingga-2 text-white text-sm sm:text-base font-title font-semibold rounded-full shadow-lg hover:bg-jingga-3 hover:scale-105 active:scale-95 transition-all w-[85%] sm:w-auto">
          Buka Kartu
        </button>
      </div>
    </div>

  </div>

  <!-- ====== JAVASCRIPT LOGIKA ====== -->
  <script>
    function bukaKartu() {
      const cover = document.getElementById('coverKartu');
      const pesan = document.getElementById('pesanDalam');
      
      // === INI YANG DITAMBAHKAN: Memanggil Lagu ===
      const lagu = document.getElementById('laguUltah');

      // === INI YANG DITAMBAHKAN: Memutar Lagu ===
      lagu.play().catch(error => {
        console.log("Audio tertahan oleh browser:", error);
      });

      // 1. Animasi membuka cover (terlipat ke atas dan menghilang)
      cover.style.transform = 'translateY(-100%) scale(0.9)';
      cover.style.opacity = '0';

      // 2. Memunculkan pesan di dalam kartu
      setTimeout(() => {
        pesan.style.opacity = '1';
        pesan.style.transform = 'scale(1)';
        
        // 3. Ledakan Confetti 🎉
        fireConfetti();
      }, 350); 
    }

    // Fungsi Confetti
    function fireConfetti() {
      var duration = 3 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 60,
          origin: { x: 0 },
          colors: ['#F9E6A8', '#F2A900', '#CC6F00'] 
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 60,
          origin: { x: 1 },
          colors: ['#F9E6A8', '#F2A900', '#CC6F00']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>
