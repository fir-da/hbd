<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>
  
  <!-- Font Playful (Fredoka & Quicksand) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Custom Colors -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'title': ['Fredoka', 'sans-serif'],
            'body': ['Quicksand', 'sans-serif'],
          },
          colors: {
            'jingga-1': '#F9E6A8', /* Kuning/Jingga sangat terang */
            'jingga-2': '#F2A900', /* Oranye cerah/Emas */
            'jingga-3': '#CC6F00', /* Oranye gelap */
            'jingga-4': '#4D2A00', /* Cokelat tua untuk teks */
          }
        }
      }
    }
  </script>

  <!-- Script Ringan untuk Efek Confetti 🎉 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Efek melayang pelan untuk cover kartu */
    .float-anim {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-jingga-1 via-jingga-2 to-jingga-3 min-h-screen flex items-center justify-center p-5 overflow-hidden">

  <!-- ==========================================
       KARTU UTAMA
  =========================================== -->
  <div class="relative w-full max-w-md aspect-[3/4] sm:aspect-square bg-white rounded-3xl shadow-2xl overflow-hidden">
    
    <!-- 1. BAGIAN DALAM KARTU (Pesan) -->
    <div id="pesanDalam" class="absolute inset-0 p-8 flex flex-col items-center justify-center text-center opacity-0 scale-95 transition-all duration-700 ease-out z-0">
      <div class="w-20 h-20 mb-4 text-5xl">🎂</div>
      <h2 class="font-title text-3xl text-jingga-3 mb-4">Happy Birthday,<br>farekha!</h2>
      
      <!-- Menggunakan warna paling gelap untuk teks agar mudah dibaca -->
      <p class="font-body text-jingga-4 text-[15px] leading-relaxed mb-6 font-medium">
        Selamat bertambah usia! Semoga hari-harimu selalu dipenuhi kebahagiaan, rezeki yang lancar, dan semua impian baikmu segera terwujud. 
        <br><br>
        Terima kasih sudah menjadi orang yang luar biasa! ✨
      </p>

      <p class="font-title text-sm text-jingga-2 font-bold">Dari: af</p>
    </div>

    <!-- 2. COVER KARTU (Sampul Depan) -->
    <div id="coverKartu" class="absolute inset-0 bg-white p-8 flex flex-col items-center justify-center text-center z-10 transition-transform duration-700 ease-in-out origin-top border-4 border-white">
      <div class="bg-jingga-1 w-full h-full rounded-2xl flex flex-col items-center justify-center p-6 shadow-inner relative overflow-hidden">
        
        <!-- Ornamen Dekorasi -->
        <div class="absolute -top-4 -right-4 w-16 h-16 bg-white/40 rounded-full blur-xl"></div>
        <div class="absolute -bottom-4 -left-4 w-20 h-20 bg-white/40 rounded-full blur-xl"></div>

        <div class="text-6xl mb-4 float-anim">💌</div>
        <h1 class="font-title text-2xl text-jingga-4 mb-2">Ada Pesan Rahasia!</h1>
        <p class="font-body text-sm text-jingga-3 font-bold mb-8">Khusus buat kamu hari ini.</p>
        
        <button onclick="bukaKartu()" class="px-6 py-3 bg-jingga-2 text-white font-title font-semibold rounded-full shadow-lg hover:bg-jingga-3 hover:scale-105 active:scale-95 transition-all">
          Buka Kartu Sekarang
        </button>
      </div>
    </div>

  </div>

  <!-- ====== JAVASCRIPT LOGIKA ====== -->
  <script>
    function bukaKartu() {
      const cover = document.getElementById('coverKartu');
      const pesan = document.getElementById('pesanDalam');

      // 1. Animasi membuka cover (terlipat ke atas dan menghilang)
      cover.style.transform = 'translateY(-100%) scale(0.9)';
      cover.style.opacity = '0';

      // 2. Memunculkan pesan di dalam kartu
      setTimeout(() => {
        pesan.style.opacity = '1';
        pesan.style.transform = 'scale(1)';
        
        // 3. Ledakan Confetti 🎉
        fireConfetti();
      }, 300); // Muncul setelah 0.3 detik
    }

    // Fungsi tambahan dari library Canvas Confetti
    function fireConfetti() {
      var duration = 3 * 1000; // Confetti turun selama 3 detik
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#F9E6A8', '#F2A900', '#CC6F00'] // Warna confetti mengikuti tema jingga
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#F9E6A8', '#F2A900', '#CC6F00']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>
</body>
</html>
